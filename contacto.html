<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="./assets/img/logo.svg" type="image/svg+xml">

    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/header.css">

    <title>Contacto</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>


<body>

    <nav class="principal" id="header" aria-label="Navegación principal">
        <!-- Placeholder -->
    </nav>
    <main>
        <section>
            <header>
                <h2>Contacta con nosotros</h2>
            </header>
            <article>
                <h3>Formulario de contacto</h3>
                <form action="./enviado.html" method="get" id="formContacto" enctype="multipart/form-data">
                    <fieldset>
                        <legend>Campos a rellenar</legend>
                        <ul>
                            <li>
                                <!-- pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]{3,50}" -->
                                <!-- title="Sólo se admiten letras del alfabeto español y espacios en blanco" -->
                                <label for="name">Nombre completo</label>
                                <input type="text" placeholder="Tu nombre" name="name" id="name" required />
                            </li>
                            <li>
                                <label for="email">E-mail</label>
                                <input type="email" placeholder="Correo electrónico" name="email" id="email" required />
                            </li>
                            <li>
                                <label for="tfno">Teléfono</label>
                                <input type="tel" placeholder="Teléfono" name="phone" id="tfno" />
                            </li>
                            <li>
                                <label for="edad">Edad</label>
                                <input type="number" placeholder="Edad" id="edad" name="age" min="1" max="200" />
                            </li>

                            <li class="respuesta">
                                <span>¿Deseas recibir respuesta?</span>

                                <div class="opciones">
                                    <input type="radio" name="answer" value="y" id="yes" />
                                    <label for="yes">Sí</label>

                                    <input type="radio" name="answer" value="n" id="no" />
                                    <label for="no">No</label>
                                </div>
                            </li>

                            <li class="textarea">
                                <label for="mensaje">Mensaje</label>
                                <textarea placeholder="Escribe tu mensaje aquí" name="mensaje" id="mensaje" cols="30"
                                    rows="5" required></textarea>
                            </li>

                            <li>
                                <input type="checkbox" name="rgpd" id="acepto" required />
                                <label for="acepto">
                                    Acepto el tratamiento de mis datos personales. Más información en
                                    <a href="./rgpd.html">Política de tratamiento de datos personales</a>
                                </label>
                            </li>
                        </ul>

                        <p id="errores"></p>

                        <ul class="enviar">
                            <li>
                                <input type="submit" value="Enviar" id="enviar" />
                            </li>
                            <li>
                                <input type="reset" value="Borrar" />
                            </li>
                        </ul>
                    </fieldset>
                </form>
            </article>
        </section>

    </main>
    <footer class="news-footer" id="footer">

    </footer>
    <script>
        $(function () {
            $("#header").load("./header.html");
            $("#footer").load("./footer.html");
        });
    </script>
</body>

</html>
